manifestVersion: 1
id: bob-wallet
name: Bob DNS
tagline: Handshake DNS wallet and full node
icon: https://raw.githubusercontent.com/galetaire/bob-umbrel/main/bob-wallet/icon.png
category: networking
version: "2.3.12-web.4"
port: 8337
description: >-
  Bob DNS is a Handshake (HNS) wallet with a built-in full node. Use it to
  manage HNS, bid on name auctions, and manage your Handshake domains and DNS records.


  This app runs Bob LearnHNS as a web app: its wallet, Handshake full node and
  services run on your Umbrel, and you use Bob's own interface directly in
  your browser. Your node keeps syncing when you close the browser tab.


  Files you export (CSV, backups, logs) are downloaded by your browser, and
  files you import are picked from your computer.


  ⚠️ The first sync of the Handshake blockchain can take several hours and
  uses tens of GB of disk space. Full node takes 100GB at november 2026.


  Runs on x86_64 (Umbrel Home, PCs) and ARM64 (Raspberry Pi 4/5). Ledger
  hardware wallets are not supported in the web version.


  ⚠️ Always back up your seed phrase. Uninstalling this app permanently deletes
  its data, including your wallet files.
developer: Shadstone / LearnHNS
website: https://github.com/shadstoneofficial/bob-wallet
submitter: galetaire
submission: https://github.com/galetaire/bob-umbrel
repo: https://github.com/shadstoneofficial/bob-wallet
support: https://github.com/shadstoneofficial/bob-wallet/issues
gallery:
  - https://raw.githubusercontent.com/galetaire/bob-umbrel/main/bob-wallet/gallery/1.png
  - https://raw.githubusercontent.com/galetaire/bob-umbrel/main/bob-wallet/gallery/2.png
  - https://raw.githubusercontent.com/galetaire/bob-umbrel/main/bob-wallet/gallery/3.png
releaseNotes: >-
  Bob now runs as a native web app instead of a remote desktop. Your
  existing wallets and synced chain data are kept.
dependencies: []
path: ""
