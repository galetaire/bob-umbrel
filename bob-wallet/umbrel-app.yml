manifestVersion: 1
id: bob-wallet
name: Bob DNS
tagline: Handshake DNS wallet and full node
icon: https://raw.githubusercontent.com/galetaire/bob-umbrel/main/bob-wallet/icon.png
category: networking
version: "2.3.12-web.6"
port: 8337
description: >-
  Bob DNS is a Handshake (HNS) wallet with a built-in full node. Use it to
  manage HNS, bid on name auctions, and manage your Handshake domains and DNS records.


  This app runs Bob LearnHNS as a web app: its wallet, Handshake full node and
  services run on your Umbrel, and you use Bob's own interface directly in
  your browser. Your node keeps syncing when you close the browser tab. Ledger hardware
  wallets are not supported in this version.


  Bob Wallet and Handshake are open decentralized projects, so there’s no such thing as “official”.
  But if you have questions or want to join the community, GitHub or Discord are a good place to start.
  Discord main channel: https://discord.gg/Q2HfjDGfz


  💾 The initial sync of the Handshake blockchain can take several hours or even days. As of October 2026,
  a full node requires about 150 GB of disk space. Until your full node has finished syncing, the best
  approach is to run in SPV mode whenever you need the wallet, and switch back to full-node mode when you
  want the sync to make progress. Once your node is fully synced, there’s no need to switch back to SPV mode.


  ⚠️ Always back up your seed phrase. Uninstalling this app permanently deletes
  its data, including your wallet files.
